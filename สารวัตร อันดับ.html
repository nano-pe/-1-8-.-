<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  height:100vh;
  background:white;
}

/* กรอบเหลืองเต็มจอ */
.yellow{
  width:100vw;
  height:100vh;
  border:20px solid #fff000;
  padding:25px;
}

/* กรอบเขียว */
.green{
  width:100%;
  height:100%;
  border:18px solid #32b000;
  border-radius:25px;
  padding:45px;
}

/* กล่องข้อความ */
.textbox{
  width:75%;
  height:55px;
  margin:25px auto;
  background:#222;
  border-radius:20px;
  padding:10px 20px;
}

.textbox input{
  width:100%;
  height:100%;
  background:transparent;
  border:0;
  outline:none;
  color:white;
  font-size:20px;
}

/* อันแรกเล็ก */
.textbox:first-child{
  width:45%;
  height:35px;
  margin-top:0;
}

.textbox:first-child input{
  font-size:12px;
}

</style>

</head>

<body>

<div class="yellow">

<div class="green">

<div class="textbox">
<input placeholder="การจัดอันดับ สารวัตร ☆">
</div>

<div class="textbox">
<input placeholder="☆☆☆☆☆ กนกพล ทองแป้น (หัวหน้าสารวัตร">
</div>

<div class="textbox">
<input placeholder="☆☆☆☆☆ กษิดิศ สุทา ( - ) ">
</div>

<div class="textbox">
<input placeholder="☆☆☆☆☆ สรธร มุสิแก้ว ( - ) ">
</div>

<div class="textbox">
<input placeholder="☆☆☆☆☆ นันท์พิพัฒน์ สุขปลั่ง ( - )">
</div>

<div class="textbox">
<input placeholder="☆☆☆☆☆ พิชชากร พันธ์สอน">
</div>

</div>

</div>

</body>
</html>
